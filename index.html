<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <!-- Подключаем API Телеграма -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <script>
        // Инициализируем Web App
        Telegram.WebApp.ready();

        // Вызываем встроенный сканер Telegram
        Telegram.WebApp.showScanQrPopup({
            text: "Наведите камеру на QR-код" // Текст-подсказка под сканером
        }, function(text) {
            // Эта функция сработает, когда код будет отсканирован
            Telegram.WebApp.sendData(text); // Отправляем текст боту
            Telegram.WebApp.close();        // Закрываем окно
            return true; 
        });

        // Если пользователь закроет сканер, просто закрываем Web App
        Telegram.WebApp.onEvent('scanQrPopupClosed', function() {
            Telegram.WebApp.close();
        });
    </script>
</body>
</html>
