<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Подключаем скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
    </style>
</head>
<body>
    <script>
        // Инициализируем WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран (опционально)

        // Вызываем нативный сканер QR
        tg.showScanQrPopup({
            text: "Наведите камеру на QR-код" // Текст под сканером
        }, function(qrText) {
            // Эта функция сработает, когда код отсканируется
            if (qrText) {
                // Отправляем текст QR-кода обратно в бота
                tg.sendData(qrText);
            }
            return true; // Закрывает сканер после успешного считывания
        });
    </script>
</body>
</html>
